name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux déploiements ne doivent jamais se chevaucher : le second fermerait le port SSH du premier.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Open SSH port
        uses: ./.github/actions/firewall
        with:
          enabled: '1'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
          endpoint: ${{ secrets.OPNSENSE_ENDPOINT }}
          rule_id: ${{ secrets.OPNSENSE_RULE_ID }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            ConnectTimeout 30
            ServerAliveInterval 60
          EOF

      # Each release lands in its own folder and `current` switches over in one move: the running
      # game never sees a half-copied tree, and the previous two releases stay for a rollback.
      # After the restart the game must answer /api/health within 40 s; otherwise `current` goes
      # back to the previous release and the run fails. (The game also copies the database to
      # `backups/` just before it starts, before any migration of the new version.)
      - name: Deploy
        env:
          BASE: ${{ secrets.SPELEO_DEPLOY_PATH }}
        run: |
          : "${BASE:?SPELEO_DEPLOY_PATH is not set}"
          RELEASE="$BASE/releases/$GITHUB_SHA"
          tar -czf - package.json server.js src public data scripts | ssh server "
            set -e
            PREV=\$(readlink -f '$BASE/current' || true)
            rm -rf '$RELEASE' && mkdir -p '$RELEASE'
            tar -xzf - -C '$RELEASE'
            ln -sfn '$RELEASE' '$BASE/current.new'
            mv -Tf '$BASE/current.new' '$BASE/current'
            sudo systemctl restart speleologie
            ENVIRONMENT=\$(systemctl show speleologie -p Environment --value 2>/dev/null || true)
            PORT=\$(echo \"\$ENVIRONMENT\" | tr ' ' '\\n' | sed -n 's/^PORT=//p' | head -1)
            HOST=\$(echo \"\$ENVIRONMENT\" | tr ' ' '\\n' | sed -n 's/^HOST=//p' | head -1)
            healthy() {
              systemctl is-active --quiet speleologie || return 1
              [ -n \"\$PORT\" ] || return 0
              URL=\"http://\${HOST:-127.0.0.1}:\$PORT/api/health\"
              if command -v curl >/dev/null 2>&1; then curl -fsS -m 5 \"\$URL\" >/dev/null
              elif command -v node >/dev/null 2>&1; then node -e \"fetch(process.argv[1]).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))\" \"\$URL\"
              fi
            }
            ok=0
            for i in \$(seq 1 20); do
              sleep 2
              if healthy; then ok=1; break; fi
            done
            if [ \"\$ok\" != 1 ]; then
              echo 'The game does not answer after the update: going back to the previous release.' >&2
              if [ -n \"\$PREV\" ] && [ -d \"\$PREV\" ]; then
                ln -sfn \"\$PREV\" '$BASE/current.new'
                mv -Tf '$BASE/current.new' '$BASE/current'
                sudo systemctl restart speleologie
              fi
              exit 1
            fi
            ls -1dt '$BASE'/releases/* | tail -n +4 | xargs -r rm -rf"

      - name: Close SSH port
        if: always()
        uses: ./.github/actions/firewall
        with:
          enabled: '0'
          credentials: ${{ secrets.OPNSENSE_CREDENTIALS }}
          endpoint: ${{ secrets.OPNSENSE_ENDPOINT }}
          rule_id: ${{ secrets.OPNSENSE_RULE_ID }}
